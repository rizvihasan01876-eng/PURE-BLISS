<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — Pure Bliss</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#252016 0,#0e0d0b 38%,#070706 100%);color:#efe5d1;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:50px 50px;mask-image:linear-gradient(to bottom,black,transparent);pointer-events:none}
.card{width:min(520px,calc(100% - 34px));padding:42px 32px 34px;text-align:center;border:1px solid rgba(210,174,99,.35);border-radius:28px;background:linear-gradient(145deg,rgba(28,26,21,.96),rgba(10,10,9,.98));box-shadow:0 30px 100px rgba(0,0,0,.62),inset 0 1px rgba(255,255,255,.04);animation:rise .7s cubic-bezier(.2,.8,.2,1)}
.emblem{width:82px;height:82px;object-fit:contain;display:block;margin:0 auto 18px;filter:drop-shadow(0 8px 18px rgba(204,167,91,.16))}
.check{width:78px;height:78px;margin:0 auto 18px;border-radius:50%;border:1px solid rgba(211,176,99,.6);display:flex;align-items:center;justify-content:center;background:rgba(203,166,88,.07)}
.check svg{width:42px;height:42px}
.check circle{fill:none;stroke:#cba85f;stroke-width:2}
.check path{fill:none;stroke:#e4c77f;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70;animation:draw .7s .25s ease forwards}
.brand{font-size:11px;letter-spacing:.45em;color:#c9a65d;margin-left:.45em;margin-bottom:10px}
h1{font:500 39px/1.1 Georgia,serif;margin:0 0 12px;color:#f5ead5}
p{margin:0 auto;color:#aaa397;line-height:1.7;font-size:14px;max-width:390px}
.order{margin:24px 0 20px;padding:15px;border-radius:15px;border:1px solid rgba(202,166,90,.22);background:rgba(202,166,90,.06)}
.order span{display:block;font-size:10px;letter-spacing:.22em;color:#8e856f;margin-bottom:6px}
.order strong{font-size:20px;letter-spacing:.1em;color:#e0c174}
.total{margin-top:6px;font-size:13px;color:#c7bba7}
button{width:100%;padding:14px 20px;border:0;border-radius:13px;background:linear-gradient(135deg,#d8b66d,#9b773a);color:#111;font-weight:700;cursor:pointer;letter-spacing:.03em;transition:.2s}
button:hover{transform:translateY(-1px);filter:brightness(1.06)}
.small{margin-top:14px;font-size:11px;color:#777168}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:480px){.card{padding:34px 22px 26px}h1{font-size:32px}.emblem{width:70px;height:70px}}
</style>
</head>
<body>
<main class="card">
  <img class="emblem" src="pure-bliss-emblem.png" alt="Pure Bliss">
  <div class="check"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="21"/><path d="M14 25.5l7 7L37 17.5"/></svg></div>
  <div class="brand">PURE BLISS</div>
  <h1>Congratulations!</h1>
  <p>Your order has been submitted successfully. Thank you for choosing Pure Bliss — our team will contact you shortly to confirm your order.</p>
  <div class="order">
    <span>YOUR ORDER ID</span>
    <strong id="orderId">PB-000000</strong>
    <div class="total" id="total"></div>
  </div>
  <button onclick="window.location.href='index.html'">Continue Shopping</button>
  <div class="small">Please keep your Order ID for future reference.</div>
</main>
<script>
const params=new URLSearchParams(location.search);
document.getElementById("orderId").textContent=params.get("order")||"PB-000000";
const total=params.get("total");
if(total) document.getElementById("total").textContent="Order Total: ৳"+total;
</script>
</body>
</html>
